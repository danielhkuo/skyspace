# The whole stack on one Docker host: Caddy (TLS, static app, /api proxy),
# the Axum API, Postgres, and a cron container standing in for the systemd
# timers of docs/tech/05-ingest.md. Run from the repository root:
#
#   cp deploy/.env.template deploy/.env   # then fill it in
#   docker compose -f deploy/compose.yml up -d --build
#
# Compose reads deploy/.env on its own because it sits beside this file.
name: skyspace

x-backend: &backend
  image: skyspace-backend:local
  env_file: .env
  environment:
    DATABASE_URL: postgres://skyspace:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/skyspace
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skyspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: skyspace
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyspace -d skyspace"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # `skyspace migrate` once per deploy, before the API starts: two API
  # replicas must never race on the same migration.
  migrate:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["skyspace", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    pull_policy: never
    command: ["skyspace-api"]
    environment:
      DATABASE_URL: postgres://skyspace:${POSTGRES_PASSWORD:?}@db:5432/skyspace
      SKYSPACE_BIND: 0.0.0.0:8080
      # Same origin as the app: Caddy proxies /api, so the cookie is first-party.
      SKYSPACE_PUBLIC_ORIGIN: https://${SKYSPACE_DOMAIN:?set SKYSPACE_DOMAIN in deploy/.env}
      SKYSPACE_TRUSTED_PROXY: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s

  # The pull jobs on cron (deploy/jobs/crontab). Root only because cron
  # needs it; the archive of every Rice response lives in the volume.
  jobs:
    <<: *backend
    pull_policy: never
    user: "0"
    command: ["skyspace-cron"]
    environment:
      DATABASE_URL: postgres://skyspace:${POSTGRES_PASSWORD:?}@db:5432/skyspace
      SKYSPACE_ARCHIVE_DIR: /archive
      SKYSPACE_USER_AGENT_SITE: ${SKYSPACE_DOMAIN:?}
    volumes:
      - archive:/archive
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-demo}
    environment:
      SKYSPACE_DOMAIN: ${SKYSPACE_DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  archive:
  caddy_data:
  caddy_config:
