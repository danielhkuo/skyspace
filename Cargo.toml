[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/skyspace/skyspace"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Clippy runs in CI as: cargo clippy --all-targets -- -D warnings
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
