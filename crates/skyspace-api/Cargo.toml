[package]
name = "skyspace-api"
description = "The Skyspace HTTP server: reads Postgres, runs the engine, never calls Rice."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Writes `web/src/api/generated/` from `cargo test --features ts`; off in
# every shipped build.
ts = ["skyspace-core/ts", "dep:ts-rs"]

[dependencies]
skyspace-core = { workspace = true }
skyspace-store = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
lettre = { workspace = true }
ts-rs = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
http-body-util = { workspace = true }
